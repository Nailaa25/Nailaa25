<svg xmlns="http://www.w3.org/2000/svg" width="800" height="70" viewBox="0 0 800 70">
  <style>
    .b { animation: hop 1.6s ease-in-out infinite; }
    .b2 { animation-delay: .2s; } .b3 { animation-delay: .4s; }
    .b4 { animation-delay: .6s; } .b5 { animation-delay: .8s; }
    @keyframes hop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  </style>
